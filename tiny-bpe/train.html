<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-bpe · training step</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #e2e2e0;
  --accent: #6a3fd1; --accent-soft: #efe9fb; --pos: 214, 60, 60; --neg: 45, 105, 215;
  --heat: 88, 64, 200; --bar: #2f9e62; --code-bg: #f1f0ee; --back: #c9471b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151517; --panel: #1f1f22; --text: #ececef; --muted: #9a9aa2; --border: #34343a;
    --accent: #b49bff; --accent-soft: #2c2640; --pos: 240, 95, 95; --neg: 95, 150, 255;
    --heat: 150, 125, 255; --bar: #4cc38a; --code-bg: #28282c; --back: #f0824f;
  }
}
:root[data-theme="dark"] {
  --bg: #151517; --panel: #1f1f22; --text: #ececef; --muted: #9a9aa2; --border: #34343a;
  --accent: #b49bff; --accent-soft: #2c2640; --pos: 240, 95, 95; --neg: 95, 150, 255;
  --heat: 150, 125, 255; --bar: #4cc38a; --code-bg: #28282c; --back: #f0824f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0 12px 0 0; }
header #home { color: var(--accent); text-decoration: none; font-size: 13.5px; }
.passes { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.nav { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) clamp(340px, 28vw, 480px);
  min-height: calc(100vh - 58px); }
aside#diagram { border-left: 1px solid var(--border); background: var(--bg); position: sticky; top: 58px;
  max-height: calc(100vh - 58px); overflow-y: auto; padding: 10px 12px; }
aside#diagram svg { width: 100%; height: auto; display: block; }
aside#diagram .close { display: none; }
#diagram-toggle { display: none; }
@media (max-width: 1360px) {
  .layout { grid-template-columns: 290px minmax(0, 1fr); }
  #diagram-toggle { display: inline-block; }
  aside#diagram { display: none; position: fixed; top: 0; right: 0; bottom: 0; max-height: none; z-index: 5;
    width: min(440px, 92vw); box-shadow: -8px 0 24px rgba(0, 0, 0, .25); }
  body.diagram-open aside#diagram { display: block; }
  aside#diagram .close { display: block; margin-left: auto; }
}
nav#steps { border-right: 1px solid var(--border); overflow-y: auto; max-height: calc(100vh - 58px);
  position: sticky; top: 58px; padding: 8px 0; background: var(--panel); }
nav#steps .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  padding: 10px 16px 2px; }
nav#steps a { display: block; padding: 3px 16px 3px 22px; color: var(--text); text-decoration: none;
  font-size: 13.5px; cursor: pointer; border-left: 3px solid transparent; }
nav#steps a:hover { background: var(--accent-soft); }
nav#steps a.on { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
main { padding: 20px 28px 60px; min-width: 0; }
.crumb { color: var(--accent); font-weight: 600; font-size: 13px; }
main h2 { margin: 2px 0 12px; font-size: 22px; }
.formula { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--code-bg);
  border-radius: 6px; padding: 8px 12px; overflow-x: auto; white-space: pre; font-size: 14px; }
.explain { max-width: 820px; margin: 14px 0 20px; white-space: pre-line; }
.views { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.view { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  max-width: 100%; }
.view h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.view h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12.5px; }
th { color: var(--muted); font-weight: 500; padding: 2px 6px; text-align: right; white-space: nowrap; }
td { padding: 2px 6px; text-align: right; white-space: nowrap; }
th.rl, td.rl { text-align: left; color: var(--accent); font-weight: 600; }
table.mat td { font-family: ui-monospace, Consolas, monospace; border-radius: 3px; }
table.heat td { text-align: center; min-width: 38px; font-family: ui-monospace, Consolas, monospace; }
td.masked { color: var(--muted); }
table.mat.has-hl tr:not(.hl) td { opacity: .45; }
table.mat tr.hl td.rl { background: var(--accent); color: var(--panel); border-radius: 3px; }
table.plain td:first-child { text-align: left; }
table.plain tr + tr td { border-top: 1px solid var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; text-align: center;
  font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--bg); }
.chip b { color: var(--accent); font-weight: 600; display: block; }
.chip span { color: var(--muted); font-size: 11px; }
.chips.small .chip { font-size: 11.5px; padding: 0 4px; }
.bar { height: 10px; background: var(--bar); border-radius: 2px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 30px; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav#steps { position: static; max-height: 32vh; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  header { padding: 10px 16px; }
  .nav { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <a id="home" hidden>← all results</a>
  <h1 id="title"></h1>
  <div class="passes" id="passes"></div>
  <div class="nav"><button id="prev">← prev</button><span id="pos"></span><button id="next">next →</button>
    <button id="diagram-toggle" title="show the block diagram">diagram</button>
    <button id="theme" title="toggle theme">◐</button></div>
</header>
<div class="layout">
  <nav id="steps"></nav>
  <main id="main"></main>
  <aside id="diagram" aria-label="block diagram"><button class="close" id="diagram-close">✕</button><svg xmlns="http://www.w3.org/2000/svg" class="llmsim-diagram llmsim-train" viewBox="0 0 480 920" width="480" height="920" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Block diagram of one training step in LLM-Sim">
  <style>
    .llmsim-diagram.standalone { --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #c9c9c6; --accent: #6a3fd1; --accent-soft: #efe9fb; --bg: #f7f7f5; --back: #d9531e; }
    @media (prefers-color-scheme: dark) {
      .llmsim-diagram.standalone { --panel: #1f1f22; --text: #ececef; --muted: #9a9aa2; --border: #4a4a52; --accent: #b49bff; --accent-soft: #2c2640; --bg: #151517; --back: #f0824f; }
    }
    .llmsim-train { --back-fallback: #d9531e; }
    .llmsim-diagram .bgfill { fill: var(--bg); }
    .llmsim-diagram .node rect, .llmsim-diagram .node circle { fill: var(--panel); stroke: var(--border); stroke-width: 1.3; }
    .llmsim-diagram .node text { fill: var(--text); font-size: 13px; text-anchor: middle; }
    .llmsim-diagram .node .sub { fill: var(--muted); font-size: 11px; }
    .llmsim-diagram .node.on rect, .llmsim-diagram .node.on circle { stroke: var(--accent); stroke-width: 2.6; fill: var(--accent-soft); }
    .llmsim-diagram .node.on text { font-weight: 600; }
    .llmsim-diagram .node.clickable { cursor: pointer; }
    .llmsim-diagram .node.clickable:hover rect { stroke: var(--accent); }
    .llmsim-diagram .flow { stroke: var(--muted); stroke-width: 1.4; fill: none; }
    .llmsim-diagram .residual { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
    .llmsim-diagram .target { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 2 3; }
    .llmsim-diagram .loop { stroke: var(--accent); stroke-width: 1.4; fill: none; stroke-dasharray: 2 3; }
    .llmsim-diagram .node rect.container { fill: none; stroke: var(--border); stroke-width: 1.3; stroke-dasharray: 6 4; }
    .llmsim-diagram .node.on rect.container { fill: none; stroke: var(--accent); stroke-width: 2.6; }
    .llmsim-diagram .back path { stroke: var(--back, var(--back-fallback)); stroke-width: 1.8; fill: none; }
    .llmsim-diagram .back text { fill: var(--back, var(--back-fallback)); font-size: 11px; }
    .llmsim-diagram .back.on path { stroke-width: 3.4; }
    .llmsim-diagram .back.on text { font-weight: 700; }
    .llmsim-diagram .label { fill: var(--muted); font-size: 11.5px; }
    .llmsim-diagram .title { fill: var(--text); font-size: 12.5px; font-weight: 600; }
    .llmsim-diagram .badge { fill: var(--accent); font-size: 12px; font-weight: 600; }
    .llmsim-diagram .arrowhead { fill: var(--muted); }
    .llmsim-diagram .arrowhead-back { fill: var(--back, var(--back-fallback)); }
    .llmsim-diagram .arrowhead-accent { fill: var(--accent); }
  </style>
  <defs>
    <marker id="llmsim-t-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="llmsim-t-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead-back" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="llmsim-t-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bgfill" x="0" y="0" width="480" height="920"/>

  <!-- data -->
  <g class="node" id="t-batch"><rect x="110" y="14" width="220" height="50" rx="8"/>
    <text x="220" y="33">Batch: a window of text</text>
    <text class="sub" x="220" y="51" data-fmt="input {T} tokens · target shifted by 1">input tokens · target shifted by 1</text></g>
  <path class="target" d="M330,39 H464 V652 H334" marker-end="url(#llmsim-t-arr)"/>
  <text class="label" x="472" y="360" transform="rotate(90 472 360)" text-anchor="middle">targets: the next token at every position</text>
  <path class="flow" d="M220,64 V92" marker-end="url(#llmsim-t-arr)"/>

  <!-- forward pass -->
  <g class="node" id="t-emb"><rect x="110" y="94" width="220" height="44" rx="8"/>
    <text x="220" y="113">Embedding W_E + position P</text>
    <text class="sub" x="220" y="129">every position at once</text></g>
  <path class="flow" d="M220,138 V176" marker-end="url(#llmsim-t-arr)"/>
  <text class="label" x="104" y="160" text-anchor="end">forward ↓</text>

  <g class="node" id="t-block"><rect class="container" x="70" y="164" width="290" height="300" rx="12"/></g>
  <text class="title" x="82" y="184" data-fmt="Transformer block × {L}">Transformer block × N</text>
  <text class="badge" id="llmsim-layer-badge" x="348" y="184" text-anchor="end"></text>
  <path class="residual" d="M220,194 H92 V296 H209" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-ln1"><rect x="130" y="198" width="180" height="28" rx="7"/><text x="220" y="217">LayerNorm 1</text></g>
  <path class="flow" d="M220,226 V238" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-attn"><rect x="130" y="240" width="180" height="44" rx="7"/>
    <text x="220" y="259">Causal attention</text><text class="sub" x="220" y="275">each position sees only the past</text></g>
  <path class="flow" d="M220,284 V286" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-add1"><circle cx="220" cy="296" r="10"/><text x="220" y="301">+</text></g>
  <path class="residual" d="M220,316 H92 V422 H209" marker-end="url(#llmsim-t-arr)"/>
  <path class="flow" d="M220,306 V322" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-ln2"><rect x="130" y="324" width="180" height="28" rx="7"/><text x="220" y="343">LayerNorm 2</text></g>
  <path class="flow" d="M220,352 V364" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-ffn"><rect x="130" y="366" width="180" height="44" rx="7"/>
    <text x="220" y="385">Feed-forward</text><text class="sub" x="220" y="401">W₁ → GELU → W₂</text></g>
  <path class="flow" d="M220,410 V412" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-add2"><circle cx="220" cy="422" r="10"/><text x="220" y="427">+</text></g>
  <path class="flow" d="M220,432 V494" marker-end="url(#llmsim-t-arr)"/>

  <g class="node" id="t-lnf"><rect x="110" y="496" width="220" height="32" rx="8"/><text x="220" y="517">Final LayerNorm</text></g>
  <path class="flow" d="M220,528 V546" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-head"><rect x="110" y="548" width="220" height="44" rx="8"/>
    <text x="220" y="567">Unembedding W_U → logits</text>
    <text class="sub" x="220" y="583" data-fmt="{T} × {V}: a prediction at every position">a prediction at every position</text></g>
  <path class="flow" d="M220,592 V620" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-loss"><rect x="110" y="622" width="220" height="60" rx="8"/>
    <text x="220" y="642">Softmax + cross-entropy</text>
    <text class="sub" x="220" y="658">L = mean over positions of</text>
    <text class="sub" x="220" y="672">−log p(target)</text></g>

  <!-- backward pass: the gradient climbs back up, block by block -->
  <g class="back" id="b-logits"><path d="M330,634 H388 V572 H334" marker-end="url(#llmsim-t-back)"/>
    <text x="394" y="608">∂L/∂logits</text><text x="394" y="621">p − one-hot</text></g>
  <g class="back" id="b-head"><path d="M330,562 H388 V514 H334" marker-end="url(#llmsim-t-back)"/>
    <text x="394" y="542">∂L/∂x_f</text></g>
  <g class="back" id="b-lnf"><path d="M330,506 H388 V446 H364" marker-end="url(#llmsim-t-back)"/>
    <text x="394" y="480">∂L/∂x</text></g>
  <g class="back" id="b-block"><path d="M360,200 H388 V122 H334" marker-end="url(#llmsim-t-back)"/>
    <text x="394" y="150">∂L/∂x₀</text></g>
  <text class="label" x="378" y="330" transform="rotate(-90 378 330)" text-anchor="middle" style="fill:var(--back, var(--back-fallback))">backward ↑ last layer → first</text>

  <!-- optimisation -->
  <path class="flow" d="M220,682 V712" marker-end="url(#llmsim-t-arr)"/>
  <text class="label" x="228" y="702">once ∂L reached every layer</text>
  <g class="node" id="t-grads"><rect x="110" y="714" width="220" height="44" rx="8"/>
    <text x="220" y="733">Gradient of every parameter</text><text class="sub" x="220" y="749">∂L/∂W for W_E, W_Q … W_U</text></g>
  <path class="flow" d="M220,758 V772" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-clip"><rect x="110" y="774" width="220" height="32" rx="8"/><text x="220" y="795">Clip the global norm ‖g‖</text></g>
  <path class="flow" d="M220,806 V820" marker-end="url(#llmsim-t-arr)"/>
  <g class="node" id="t-adam"><rect x="110" y="822" width="220" height="50" rx="8"/>
    <text x="220" y="841">AdamW update</text><text class="sub" x="220" y="859">p ← p − lr·( m̂/(√v̂+ε) + λ·p )</text></g>
  <g class="node" id="t-update"><path class="loop" d="M110,847 H40 V116 H106" marker-end="url(#llmsim-t-acc)"/>
    <path class="loop" d="M40,300 H66" marker-end="url(#llmsim-t-acc)"/>
    <path class="loop" d="M40,560 H106" marker-end="url(#llmsim-t-acc)"/></g>
  <text class="label" x="30" y="480" transform="rotate(-90 30 480)" text-anchor="middle" style="fill:var(--accent)">every weight updated · then the next batch</text>
  <text class="title" x="220" y="900" text-anchor="middle">repeat on a new batch</text>
</svg>
</aside>

y, which gently shrinks matrices towards 0 (λ = 0.01 for this parameter). Shown: the first 8 elements of block0.attn.q.W.", "views": [{"label": "block0.attn.q.W", "kind": "table", "data": [["(0, 0)", "-0.18612", "+7.53e-04", "+7.53e-05", "5.67e-09", "-2.99e-03", "-0.18911"], ["(0, 1)", "+0.37087", "-4.44e-04", "-4.44e-05", "1.97e-09", "+2.99e-03", "+0.37386"], ["(0, 2)", "-0.10154", "-2.31e-03", "-2.31e-04", "5.33e-08", "+3.00e-03", "-0.09854"], ["(0, 3)", "+0.18206", "-8.64e-04", "-8.64e-05", "7.47e-09", "+2.99e-03", "+0.18505"], ["(0, 4)", "-0.19256", "-2.22e-03", "-2.22e-04", "4.91e-08", "+3.01e-03", "-0.18955"], ["(0, 5)", "-0.23343", "-1.43e-03", "-1.43e-04", "2.04e-08", "+3.01e-03", "-0.23042"], ["(0, 6)", "-0.08744", "+2.29e-04", "+2.29e-05", "5.26e-10", "-3.00e-03", "-0.09043"], ["(0, 7)", "+0.24091", "+4.79e-04", "+4.79e-05", "2.29e-09", "-3.01e-03", "+0.23790"]], "rows": null, "cols": ["element", "before", "grad g", "m", "v", "Δp", "after"], "hl": null}]}, {"section": "Update", "title": "Same batch, after the update", "formula": "L: 2.4427 → 1.7402", "explain": "Running the forward pass again on the same sequence shows the effect of one step: the loss on this batch went down. If you keep stepping on the same batch it will keep falling well below the validation loss: the model is memorising these few tokens. That is why real training uses a fresh batch every step, so that the loss goes down on text the model has never seen.", "views": [{"label": "loss", "kind": "table", "data": [["before", "2.4427"], ["after", "1.7402"], ["change", "-0.7025"]], "rows": null, "cols": ["", ""], "hl": null}]}]}, {"label": "step 2: 1.740 → 1.345", "tokens": ["G", "AR", "E", "T", ":", "⏎", "A", "␣m", "ur", "d", "er", "ous", "␣v", "ill", "ain", ",", "␣and", "␣so", "␣st", "ill", "␣thou", "␣a", "r", "t", ".", "⏎⏎", "G", "L", "O", "UC", "ES", "T"], "steps": [{"section": "Batch", "title": "Inputs and targets", "formula": "input = tokens[s .. s+31],   target = tokens[s+1 .. s+32]", "e <script>
const DATA = JSON.parse(document.getElementById("data").textContent);
let pass = 0, step = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
const isNum = v => typeof v === "number";

function scaleOf(data) {
  let m = 0;
  for (const r of data) for (const v of r) if (isNum(v)) m = Math.max(m, Math.abs(v));
  const exp = (m > 0 && m < 0.1) ? Math.floor(Math.log10(m)) : 0;
  return { max: m / Math.pow(10, exp), exp };
}
function fmt(v, exp) {
  if (v === "-inf") return "−∞";
  if (v === "inf") return "+∞";
  if (!isNum(v)) return "";
  const x = v / Math.pow(10, exp);
  return (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2);
}

function header(v, extra) {
  const h = el("h3", null, v.label);
  if (extra) h.appendChild(el("small", null, extra));
  return h;
}

function matrix(v) {
  const box = el("div", "view");
  const { max, exp } = scaleOf(v.data);
  const n = v.data.length, m = v.data[0] ? v.data[0].length : 0;
  box.appendChild(header(v, `${n}×${m}` + (exp ? `  ·  values ×1e${exp}` : "")));
  const hl = new Set(v.hl || []);
  const t = el("table", hl.size ? "mat has-hl" : "mat"), hr = el("tr");
  hr.appendChild(el("th", "rl", ""));
  for (let j = 0; j < m; j++) hr.appendChild(el("th", null, v.cols ? v.cols[j] : j));
  t.appendChild(hr);
  v.data.forEach((row, i) => {
    const tr = el("tr", hl.has(i) ? "hl" : null);
    tr.appendChild(el("td", "rl", v.rows ? v.rows[i] : i));
    row.forEach(x => {
      const td = el("td", null, fmt(x, exp));
      if (isNum(x)) {
        const a = max > 0 ? Math.min(1, Math.abs(x / Math.pow(10, exp)) / max) : 0;
        td.style.background = `rgba(var(${x >= 0 ? "--pos" : "--neg"}), ${(a * 0.75).toFixed(3)})`;
        td.title = String(x);
      } else td.className = "masked";
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  const s = el("div", "scroll"); s.appendChild(t); box.appendChild(s);
  return box;
}

function heatmap(v) {

  const t = el("table", "heat"), hr = el("tr");

  v.cols.forEach(c => hr.appendChild(el("th", "rl", c)));
  t.appendChild(hr);
  v.data.forEach((row, i) => {
    const tr = el("tr");
    tr.appendChild(el("td", "rl", v.rows ? v.rows[i] : i));
    row.forEach((x, j) => {
      if (j > i + offset) { tr.appendChild(el("td", "masked", "·")); return; }
      const td = el("td", null, x.toFixed(2));

    });
    t.appendChild(tr);
  });
  const s = el("div", "scroll"); s.appendChild(t); box.appendChild(s);
  return box;
}

function chips(v, small) {
  const box = el("div", "view");
  box.appendChild(header(v, `${v.data.length}`));
  const c = el("div", small ? "chips small" : "chips");
  v.data.forEach(([tok, id]) => {
    const ch = el("div", "chip");
    ch.appendChild(el("b", null, tok));
    if (id !== "" && id !== null) ch.appendChild(el("span", null, id));
    c.appendChild(ch);
  });
  box.appendChild(c);
  return box;
}

function topk(v) {
  const box = el("div", "view");
  box.appendChild(header(v));
  const [vh, ph] = v.cols || ["logit", "prob"];
  const hasP = v.data.length && v.data[0][2] !== null;
  const t = el("table", "plain"), hr = el("tr");
  ["token", vh].concat(hasP ? [ph, ""] : []).forEach(h => hr.appendChild(el("th", null, h)));
  t.appendChild(hr);
  v.data.forEach(([tok, val, p]) => {
    const tr = el("tr");
    tr.appendChild(el("td", "rl", tok));
    tr.appendChild(el("td", null, isNum(val) ? (val >= 0 ? "+" : "−") + Math.abs(val).toFixed(2) : ""));
    if (hasP) {
      tr.appendChild(el("td", null, (100 * p).toFixed(1) + "%"));
      const td = el("td"); td.style.width = "180px";
      const b = el("div", "bar"); b.style.width = (100 * p).toFixed(1) + "%";
      td.appendChild(b); tr.appendChild(td);
    }
    t.appendChild(tr);
  });
  box.appendChild(t);
  return box;
}

function table(v) {
  const box = el("div", "view");
  box.appendChild(header(v));
  const t = el("table", "plain");
  if (v.cols && v.cols.some(c => c)) {
    const hr = el("tr");
    v.cols.forEach(c => hr.appendChild(el("th", null, c)));
    t.appendChild(hr);
  }
  v.data.forEach(row => {
    const tr = el("tr");
    row.forEach((x, k) => tr.appendChild(el("td", k === 0 ? "rl" : null, x)));
    t.appendChild(tr);
  });
  const s = el("div", "scroll"); s.appendChild(t); box.appendChild(s);
  return box;
}

const RENDER = { matrix, vector: matrix, heatmap, tokens: v => chips(v, false),
                 vocab: v => chips(v, true), topk, table };

function renderPasses() {
  const box = document.getElementById("passes");
  box.innerHTML = "";
  if (DATA.passes.length < 2) return;
  DATA.passes.forEach((p, k) => {
    const b = el("button", k === pass ? "on" : null, p.label);
    b.onclick = () => { pass = k; step = Math.min(step, DATA.passes[k].steps.length - 1); render(); };
    box.appendChild(b);
  });
}

function renderNav() {
  const nav = document.getElementById("steps");
  nav.innerHTML = "";
  let sec = null;
  DATA.passes[pass].steps.forEach((s, k) => {
    if (s.section !== sec) { sec = s.section; nav.appendChild(el("div", "sec", sec)); }
    const a = el("a", k === step ? "on" : null, `${k + 1}. ${s.title}`);
    a.onclick = () => { step = k; render(); };
    nav.appendChild(a);
  });
  const on = nav.querySelector("a.on");
  if (on) on.scrollIntoView({ block: "nearest" });
}

function renderStep() {
  const steps = DATA.passes[pass].steps, s = steps[step];
  const main = document.getElementById("main");
  main.innerHTML = "";
  main.appendChild(el("div", "crumb", s.section));
  main.appendChild(el("h2", null, s.title));
  main.appendChild(el("div", "formula", s.formula));
  main.appendChild(el("p", "explain", s.explain));
  const views = el("div", "views");
  s.views.forEach(v => views.appendChild((RENDER[v.kind] || table)(v)));
  main.appendChild(views);
  main.appendChild(el("div", "hint", "Keys: ← → to move between steps. Hover a cell for its exact value."));
  document.getElementById("pos").textContent = `${step + 1} / ${steps.length}`;
}

// --- block diagram: highlight the block of the current step, click a block to go there ---
const NODE_RULES = [
  [/(^|\s)tok_emb\./, "n-tok-emb"], [/(^|\s)pos_emb\./, "n-pos-emb"], [/\.ln1\./, "n-ln1"],
  [/\.attn\.[qkv]\./, "n-qkv"], [/\.attn\.o\./, "n-concat"], [/\.ln2\./, "n-ln2"], [/\.ffn\./, "n-ffn"],
  [/(^|\s)ln_f\./, "n-lnf"], [/(^|\s)head\./, "n-head"],
  [/^Text → tokens|^Context so far|^Inputs and targets/, "n-tokenizer"],
  [/^Token embedding lookup|^Gradient through: Embeddings/, "n-tok-emb"],
  [/^Positional encoding/, "n-pos-emb"], [/^Input to the first block/, "n-add0"],
  [/^LayerNorm 1/, "n-ln1"], [/^Projection weights|^Queries, keys, values/, "n-qkv"], [/^KV-cache/, "n-kv"],
  [/^Attention scores|^Causal mask|^Weighted sum|^All \d+ heads/, "n-attn"],
  [/^Concatenate heads/, "n-concat"], [/^Residual connection 1/, "n-add1"], [/^LayerNorm 2/, "n-ln2"],
  [/^Feed-forward/, "n-ffn"], [/^Residual connection 2/, "n-add2"],
  [/^Final LayerNorm|^Gradient through: Final LayerNorm/, "n-lnf"],
  [/^Logits|^Last position|^Gradient of the loss w\.r\.t\. the logits|^Gradient through: Unembedding/, "n-head"],
  [/^Softmax|^Loss: cross-entropy/, "n-softmax"], [/^Pick the next token/, "n-sample"],
  [/^Gradient through: Layer/, "n-block"],
];
// training pages show the training diagram: forward, loss, backward (b-*), optimiser
const TRAIN_RULES = [
  [/^Inputs and targets/, ["t-batch"]], [/^Loss: cross-entropy/, ["t-loss"]],
  [/^Gradient of the loss w\.r\.t\. the logits/, ["t-loss", "b-logits"]],
  [/^Gradient through: Unembedding/, ["t-head", "b-logits"]],
  [/^Gradient through: Final LayerNorm/, ["t-lnf", "b-head"]],
  [/^Gradient through: Layer/, ["t-block", "b-lnf"]],
  [/^Gradient through: Embeddings/, ["t-emb", "b-block"]],
  [/^Gradient of every parameter/, ["t-grads"]], [/^Gradient clipping/, ["t-clip"]],
  [/^AdamW update/, ["t-adam", "t-update"]], [/^Same batch, after the update/, ["t-loss", "t-update"]],
];
function nodesFor(s) {
  if (DATA.diagram === "training") {
    for (const [re, ids] of TRAIN_RULES) if (re.test(s.title)) return ids;
    return [];
  }
  for (const [re, id] of NODE_RULES) if (re.test(s.title)) return [id];
  return [];
}
function nodeFor(s) { return nodesFor(s)[0] || null; }
function layerOf(s) {
  const m = (s.section + " " + s.title).match(/Layer (\d+)(?:\/(\d+))?/);
  return m ? { i: +m[1], n: m[2] ? +m[2] : null } : null;
}
const diagram = document.querySelector("#diagram svg");
function fillDiagramLabels() {
  const c = DATA.model;
  if (!diagram || !c) return;
  const v = { V: c.vocab_size, C: c.d_model, T: c.block_size, H: c.n_heads, D: c.d_model / c.n_heads,
              L: c.n_layers, F: c.d_ff };
  diagram.querySelectorAll("[data-fmt]").forEach(t => {
    t.textContent = t.dataset.fmt.replace(/\{(\w)\}/g, (_, k) => v[k] ?? k);
  });
}
function renderDiagram() {
  if (!diagram) return;
  const steps = DATA.passes[pass].steps, s = steps[step], ids = nodesFor(s);
  diagram.querySelectorAll(".node, .back").forEach(n => {
    n.classList.toggle("on", ids.includes(n.id));
    n.classList.toggle("clickable", steps.some(x => nodeFor(x) === n.id));
  });
  const L = layerOf(s), head = s.section.match(/Head (\d+)\/(\d+)/), all = s.title.match(/^All (\d+) heads/);
  const lb = diagram.querySelector("#llmsim-layer-badge"), hb = diagram.querySelector("#llmsim-head-badge");
  if (lb) lb.textContent = L ? `layer ${L.i}${L.n ? " / " + L.n : ""}` : "";
  if (hb) hb.textContent = head ? `head ${head[1]} / ${head[2]}` : all ? `all ${all[1]} heads` : "";
}
if (diagram) {
  diagram.querySelectorAll(".node").forEach(n => n.addEventListener("click", () => {
    const steps = DATA.passes[pass].steps, cur = layerOf(steps[step]);
    const hits = steps.map((x, k) => [x, k]).filter(([x]) => nodeFor(x) === n.id);
    if (!hits.length) return;
    const sameLayer = cur && hits.find(([x]) => { const l = layerOf(x); return l && l.i === cur.i; });
    step = (sameLayer || hits[0])[1];
    document.body.classList.remove("diagram-open");
    render();
  }));
  fillDiagramLabels();
}
document.getElementById("diagram-toggle").onclick = () => document.body.classList.toggle("diagram-open");
document.getElementById("diagram-close").onclick = () => document.body.classList.remove("diagram-open");

function render() { renderPasses(); renderNav(); renderStep(); renderDiagram(); }
function move(d) {
  const n = DATA.passes[pass].steps.length;
  step = Math.max(0, Math.min(n - 1, step + d));
  render();
  window.scrollTo({ top: 0 });
}
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
document.getElementById("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") move(1);
  if (e.key === "ArrowLeft") move(-1);
});
document.getElementById("title").textContent = DATA.title;
if (DATA.home) { const a = document.getElementById("home"); a.href = DATA.home; a.hidden = false; }
render();
</script>
</body>
</html>
