<head>

<style>

}

}
:root[data-theme="dark"] {
  --bg: #151517; --panel: #1f1f22; --text: #ececef; --muted: #9a9aa2; --border: #34343a;
  --accent: #b49bff; --accent-soft: #2c2640; --pos: 240, 95, 95; --neg: 95, 150, 255;

    --in: #4cc6cf; --in-soft: #16292b; --out: #f0b048; --out-soft: #2d2415;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0 12px 0 0; }
header #home, header #glossary-link { color: var(--accent); text-decoration: none; font-size: 13.5px; }
.passes { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-size: 13px; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.nav { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) clamp(340px, 28vw, 480px);
  min-height: calc(100vh - 58px); }
aside#diagram { border-left: 1px solid var(--border); background: var(--bg); position: sticky; top: 58px;
  max-height: calc(100vh - 58px); overflow-y: auto; padding: 10px 12px; }
aside#diagram svg { width: 100%; height: auto; display: block; }
aside#diagram .close { display: none; }
#diagram-toggle { display: none; }
@media (max-width: 1360px) {
  .layout { grid-template-columns: 290px minmax(0, 1fr); }
  #diagram-toggle { display: inline-block; }
  aside#diagram { display: none; position: fixed; top: 0; right: 0; bottom: 0; max-height: none; z-index: 5;
    width: min(440px, 92vw); box-shadow: -8px 0 24px rgba(0, 0, 0, .25); }
  body.diagram-open aside#diagram { display: block; }
  aside#diagram .close { display: block; margin-left: auto; }
}
nav#steps { border-right: 1px solid var(--border); overflow-y: auto; max-height: calc(100vh - 58px);
  position: sticky; top: 58px; padding: 8px 0; background: var(--panel); }
nav#steps .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  padding: 10px 16px 2px; }
nav#steps a { display: block; padding: 3px 16px 3px 22px; color: var(--text); text-decoration: none;
  font-size: 13.5px; cursor: pointer; border-left: 3px solid transparent; }
nav#steps a:hover { background: var(--accent-soft); }
nav#steps a.on { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
main { padding: 20px 28px 60px; min-width: 0; }
.crumb { color: var(--accent); font-weight: 600; font-size: 13px; }
main h2 { margin: 2px 0 12px; font-size: 22px; }
.formula { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--code-bg);
  border-radius: 6px; padding: 8px 12px; overflow-x: auto; white-space: pre; font-size: 14px; }
.explain { max-width: 820px; margin: 14px 0 20px; white-space: pre-line; }
.views { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.view { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  max-width: 100%; }
.view h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.view h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
/* what goes into the step and what comes out of it */
.view.input { background: var(--in-soft); border-color: var(--in); border-left-width: 4px; }
.view.output { background: var(--out-soft); border-color: var(--out); border-left-width: 4px; }
.role { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--panel); border-radius: 4px; padding: 1px 6px; margin-right: 7px; vertical-align: 1px; }
.input .role { background: var(--in); }
.output .role { background: var(--out); }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12.5px; }
th { color: var(--muted); font-weight: 500; padding: 2px 6px; text-align: right; white-space: nowrap; }
td { padding: 2px 6px; text-align: right; white-space: nowrap; }
th.rl, td.rl { text-align: left; color: var(--accent); font-weight: 600; }
table.mat td { font-family: ui-monospace, Consolas, monospace; border-radius: 3px; }
table.heat td { text-align: center; min-width: 38px; font-family: ui-monospace, Consolas, monospace; }
td.masked { color: var(--muted); }
table.mat.has-hl tr:not(.hl) td { opacity: .45; }
table.mat tr.hl td.rl { background: var(--accent); color: var(--panel); border-radius: 3px; }
table.plain td:first-child { text-align: left; }
table.plain tr + tr td { border-top: 1px solid var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; text-align: center;
  font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--bg); }
.chip b { color: var(--accent); font-weight: 600; display: block; }
.chip span { color: var(--muted); font-size: 11px; }
.chips.small .chip { font-size: 11.5px; padding: 0 4px; }
.bar { height: 10px; background: var(--bar); border-radius: 2px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 30px; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav#steps { position: static; max-height: 32vh; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  header { padding: 10px 16px; }
  .nav { margin-left: 0; }
}
</style>

<script type="application/json" id="glossary-data">{
  "groups": [
    {"id": "text", "title": "Text and tokens"},
    {"id": "vectors", "title": "Vectors and positions"},
    {"id": "block", "title": "The transformer block"},
    {"id": "output", "title": "Output and generation"},
    {"id": "training", "title": "Training"},
    {"id": "modern", "title": "Architectures of recent LLMs"}
  ],
  "terms": [
    {"id": "token", "group": "text", "term": "Token",
     "aliases": ["tokens", "token"],
     "short": "The smallest piece of text the model sees: a character, a piece of a word or a whole word, always turned into an integer id.",
     "long": "A language model never reads characters or words directly: the tokenizer cuts the text into tokens and replaces each one with its number in the vocabulary. Everything the model computes is per token: one row of every matrix in the trace is one token.",
     "in_llmsim": "\"Text → tokens → ids\", the first step of every prediction.",
     "related": ["tokenizer", "vocabulary"]},
    {"id": "tokenizer", "group": "text", "term": "Tokenizer",
     "aliases": ["tokenizers", "tokenizer"],
     "short": "Turns text into a sequence of token ids, and ids back into text.",
     "long": "The tokenizer is fixed before training and is not part of the neural network. It decides how long sequences are and which pieces of text the model can treat as units. Character, BPE and byte-level BPE tokenizers are the three kinds used in this project.",
     "in_llmsim": "\"Text → tokens → ids\". The three models use a character, a BPE and GPT-2's byte-level BPE tokenizer.",
     "related": ["token", "char-tokenizer", "bpe", "byte-bpe"]},
    {"id": "vocabulary", "group": "text", "term": "Vocabulary",
     "aliases": ["vocabularies", "vocabulary", "vocab"],
     "short": "Every token the model knows; its size V sets how many rows W_E has and how many logits come out.",
     "long": "65 tokens for the character model, 256 for the BPE one, 50257 for GPT-2 and TinyStories, 100k–260k for recent LLMs. A larger vocabulary makes texts shorter (fewer tokens) but the embedding and unembedding tables bigger.",
     "in_llmsim": "The table shown in \"Text → tokens → ids\"; the rows of W_E in the \"weights\" page.",
     "related": ["token", "embedding", "logits"]},
    {"id": "char-tokenizer", "group": "text", "term": "Character tokenizer",
     "aliases": ["character tokenizer", "char tokenizer"],
     "short": "One token per character: easy to follow, but texts become long sequences.",
     "long": "The vocabulary is just the set of characters found in the training text. Nothing needs to be learned, every number fits on screen, but the model must spend its layers rebuilding words out of letters.",
     "in_llmsim": "The default model, weights/tiny.npz.",
     "related": ["tokenizer", "bpe"]},
    {"id": "bpe", "group": "text", "term": "BPE (Byte-Pair Encoding)",
     "aliases": ["byte-pair encoding", "BPE"],
     "short": "Builds the vocabulary by repeatedly merging the most frequent pair of tokens (\"t\" + \"h\" → \"th\").",
     "long": "Training starts from single characters (or bytes) and adds one new token per merge until the vocabulary has the wanted size. Frequent words end up as a single token, rare ones are split into pieces, so no text is ever out of vocabulary.",
     "in_llmsim": "weights/tiny-bpe.npz (256 tokens); train your own with `train --tokenizer bpe`.",
     "related": ["merges", "byte-bpe", "tokenizer"]},
    {"id": "merges", "group": "text", "term": "Merges",
     "aliases": ["merges", "merge"],
     "short": "The ordered list of pairs that BPE learned to fuse; applied in the same order to tokenize new text.",
     "long": "Tokenizing with BPE means starting from characters (or bytes) and applying the merges one after the other, earliest learned first. The merge list and the vocabulary together are the whole tokenizer.",
     "in_llmsim": "\"Text → tokens → ids\" with a BPE model shows the merges applied to the prompt.",
     "related": ["bpe"]},
    {"id": "byte-bpe", "group": "text", "term": "Byte-level BPE",
     "aliases": ["byte-level BPE", "byte-level"],

    {"id": "embedding", "group": "vectors", "term": "Embedding",
     "aliases": ["token embeddings", "token embedding", "embeddings", "embedding", "W_E"],
     "short": "The vector of numbers that stands for a token: one row of the matrix W_E, picked by the token id.",
     "long": "Looking up an embedding is the same as multiplying a one-hot vector by W_E. The rows are learned: tokens that behave alike end up with similar vectors.",

    {"id": "d-model", "group": "vectors", "term": "d_model",
     "aliases": ["d_model", "model width", "hidden size"],
     "short": "The width of the vectors that flow through the model: 16 here, 768 in GPT-2, 4096–8192 in large LLMs.",
     "long": "Every token is a vector of d_model numbers from the embedding to the final LayerNorm. Most weight matrices have d_model rows or columns, so it largely sets the size of the model.",

    {"id": "positional-encoding", "group": "vectors", "term": "Positional encoding",
     "aliases": ["positional encodings", "positional encoding", "position encoding", "positional embedding"],
     "short": "How the model knows the order of the tokens: without it, \"dog bites man\" and \"man bites dog\" look the same.",
     "long": "Attention by itself treats its input as a set. Order is added either by summing a position vector to every token (learned or sinusoidal), or by rotating queries and keys inside attention (RoPE).",
     "in_llmsim": "\"Positional encoding\" and \"Positional encoding: how P is obtained, and why\".",
     "related": ["learned-pos", "rope"]},
    {"id": "learned-pos", "group": "vectors", "term": "Learned position embedding",
     "aliases": ["learned position embeddings", "learned position embedding", "position embeddings", "position embedding", "position vector", "position matrix"],
     "short": "A learned vector P[t] for every position t, added to the token embedding (GPT-2).",
     "long": "The table P has one row per position of the context window and is trained like every other weight. Its drawback: the model cannot handle positions beyond the table.",

    {"id": "rope", "group": "vectors", "term": "RoPE (Rotary Position Embedding)",
     "aliases": ["rotary position embedding", "RoPE"],
     "short": "Rotates every query and key by an angle proportional to its position, so q·k depends only on how far apart two tokens are.",
     "long": "The vector is split in pairs of dimensions, each rotated at its own speed; θ sets the slowest one, and long-context models use a large θ. Nothing is added to the residual stream. Used by Llama, Qwen, DeepSeek and most recent LLMs.",
     "in_llmsim": "weights/tiny-rope.npz, or `train --pos rope`; see \"Queries, keys, values\".",
     "related": ["positional-encoding", "qkv"]},
    {"id": "residual-stream", "group": "vectors", "term": "Residual stream",
     "aliases": ["residual streams", "residual stream"],
     "short": "The vector of each position that runs through all the blocks; every block adds its contribution to it.",
     "long": "Attention and feed-forward never replace the vector, they add to it, so it accumulates everything the layers computed. It starts as embedding + position (x₀) and ends in the final LayerNorm.",

    {"id": "residual-connection", "group": "vectors", "term": "Residual connection",
     "aliases": ["residual connections", "residual connection", "skip connection"],
     "short": "The sum x + f(x) around attention and around the feed-forward: the block adds to its input instead of replacing it.",
     "long": "It keeps the information of the earlier layers and, during training, carries the gradient straight through every block, which is what makes deep networks trainable.",

    {"id": "activation", "group": "vectors", "term": "Activation (hidden state)",

    {"id": "block", "group": "block", "term": "Transformer block (layer)",

     "short": "The unit repeated N times: LayerNorm → attention → add, LayerNorm → feed-forward → add.",
     "long": "All blocks have the same shape but their own weights. Attention moves information between tokens, the feed-forward transforms each token on its own. 2 blocks here, 12 in GPT-2, 30–100 in large LLMs.",

     "aliases": ["layer normalization", "LayerNorm"],
     "short": "Brings each vector to mean 0 and variance 1, then rescales it with the learned weights γ and β.",

    {"id": "self-attention", "group": "block", "term": "Self-attention",
     "aliases": ["self-attention", "attention layer", "attention"],
     "short": "Each token gathers information from the other tokens, weighing them by how relevant they are.",
     "long": "Every token compares its query with the keys of the tokens before it, turns the scores into weights with a softmax, and takes the weighted sum of their values. It is the only place where tokens exchange information.",
     "in_llmsim": "From \"Queries, keys, values\" to \"Concatenate heads + output projection\".",
     "related": ["qkv", "attention-score", "attention-weights", "causal-mask", "multi-head"]},
    {"id": "qkv", "group": "block", "term": "Query, key, value (Q, K, V)",
     "aliases": ["queries, keys, values", "queries, keys and values", "queries and keys", "query", "queries", "keys", "W_Q", "W_K", "W_V"],
     "short": "Three projections of each token: the query says what it looks for, the key what it offers, the value what it passes on if chosen.",
     "long": "They are the products x·W_Q, x·W_K and x·W_V of the normalized residual stream. The match between a query and a key decides how much of that key's value the token takes.",

    {"id": "attention-score", "group": "block", "term": "Attention score",
     "aliases": ["attention scores", "attention score"],
     "short": "q·k / √d_h: how relevant one token is to another, before the softmax.",

    {"id": "attention-weights", "group": "block", "term": "Attention weights (pattern)",
     "aliases": ["attention weights", "attention pattern", "attention patterns"],
     "short": "The scores after the softmax: row i says how token i spreads its attention over the tokens up to itself; each row sums to 1.",
     "long": "This is the heatmap of every head. Each head learns its own pattern, e.g. look at the previous token, or at the start of the line.",

     "aliases": ["causal masks", "causal mask", "causal masking"],
     "short": "Sets to −∞ the scores towards future positions, so a token only sees itself and the past.",
     "long": "After the softmax those positions get weight 0. It is what lets training predict every position of a sequence at once without peeking at the answer.",

    {"id": "attention-head", "group": "block", "term": "Attention head",

    {"id": "ffn", "group": "block", "term": "Feed-forward network (FFN, MLP)",

     "short": "Two matrix products with a non-linearity in between, applied to each token on its own.",

    {"id": "optimizer", "group": "training", "term": "Optimizer",

     "short": "The rule that turns the gradients into updates of the weights.",
     "long": "The simplest is plain gradient descent, w ← w − lr·g. LLMs almost always use AdamW.",

    {"id": "adamw", "group": "training", "term": "AdamW",
     "aliases": ["AdamW"],
     "short": "The optimizer of LLMs: keeps a running average of each gradient (momentum) and of its square, plus weight decay.",
     "long": "Dividing by the root of the squared average gives every weight a step of similar size, whatever the scale of its gradient. The \"W\" is the decoupled weight decay.",
     "in_llmsim": "\"AdamW update\" shows m, v and the change of every weight.",

     "short": "An LLM whose trained weights can be downloaded and run by anyone.",

<script>
// Glossary terms in the descriptive texts: the first occurrence of each term in a text is underlined,
// hovering or focusing it shows the short definition, clicking it opens the term in glossary.html.
// Shared by every page (Python and C++); the terms come from glossary.json, inlined in the page
// as <script type="application/json" id="glossary-data"> by the page generators.
const GLOSSARY = (() => {
  const node = document.getElementById("glossary-data");
  const g = node ? JSON.parse(node.textContent) : { groups: [], terms: [] };
  const byId = Object.fromEntries(g.terms.map(t => [t.id, t]));
  // alias (lower case) -> term; aliases with capitals (BPE, W_E, LayerNorm) must match exactly
  const byAlias = {};
  g.terms.forEach(t => t.aliases.forEach(a => { byAlias[a.toLowerCase()] = { term: t, alias: a, exact: /[A-Z]/.test(a) }; }));
  const alts = Object.keys(byAlias).sort((a, b) => b.length - a.length)
    .map(a => a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = alts.length ? new RegExp(`(?<![\\p{L}\\p{N}_])(?:${alts.join("|")})(?![\\p{L}\\p{N}_])`, "giu") : null;
  return { groups: g.groups, terms: g.terms, byId, byAlias, re };
})();

const SKIP = new Set(["A", "CODE", "KBD", "PRE", "SCRIPT", "STYLE", "BUTTON", "SELECT", "TEXTAREA", "SVG"]);

// Wraps the glossary terms found in the text of `root`.
// url: the glossary page ("" for the same page, null: tooltip only); seen: ids already linked, shared between calls;
// self: id of a term not to link (the entry the text belongs to).
function linkTerms(root, { url = null, newTab = false, seen = new Set(), self = null } = {}) {
  if (!root || !GLOSSARY.re) return seen;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => {
      for (let p = n.parentElement; p && p !== root.parentElement; p = p.parentElement)
        if (SKIP.has(p.tagName.toUpperCase()) || p.classList.contains("term")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const text = n.nodeValue, parts = [];
    let last = 0, m;
    GLOSSARY.re.lastIndex = 0;
    while ((m = GLOSSARY.re.exec(text))) {
      const hit = GLOSSARY.byAlias[m[0].toLowerCase()];
      if (!hit || (hit.exact && m[0] !== hit.alias) || seen.has(hit.term.id) || hit.term.id === self) continue;
      seen.add(hit.term.id);
      parts.push(document.createTextNode(text.slice(last, m.index)), termElement(m[0], hit.term, url, newTab));
      last = m.index + m[0].length;
    }
    if (!parts.length) continue;
    parts.push(document.createTextNode(text.slice(last)));
    n.replaceWith(...parts);
  }
  return seen;
}

function termElement(text, term, url, newTab) {
  const e = document.createElement(url != null ? "a" : "span");
  e.className = "term";
  e.textContent = text;
  e.dataset.term = term.id;
  if (url != null) {
    e.href = `${url}#${term.id}`;
    if (newTab) { e.target = "_blank"; e.rel = "noopener"; }
  } else e.tabIndex = 0;
  e.setAttribute("aria-label", `${text}: ${term.short}`);
  return e;
}

// One tooltip for the whole page, positioned under the hovered term.
(() => {
  const style = document.createElement("style");
  style.textContent = `
.term { color: inherit; text-decoration: underline dotted var(--accent, #6a3fd1); text-decoration-thickness: 1.5px;
  text-underline-offset: 3px; cursor: help; }
a.term { cursor: pointer; }
.term:hover, .term:focus-visible { color: var(--accent, #6a3fd1); outline: none; }
#term-tip { position: absolute; z-index: 50; max-width: min(340px, calc(100vw - 32px)); padding: 8px 10px;
  background: var(--panel, #fff); color: var(--text, #1d1d1f); border: 1px solid var(--border, #e2e2e0);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .15); font-size: 13px; line-height: 1.45;
  white-space: normal; pointer-events: none; }
#term-tip b { display: block; margin-bottom: 2px; color: var(--accent, #6a3fd1); }
#term-tip .more { display: block; margin-top: 4px; color: var(--muted, #6b6b70); font-size: 11.5px; }`;
  document.head.appendChild(style);
  const tip = document.createElement("div");
  tip.id = "term-tip";
  tip.hidden = true;
  tip.setAttribute("role", "tooltip");
  const show = e => {
    const el = e.target.closest && e.target.closest(".term");
    if (!el) return;
    const t = GLOSSARY.byId[el.dataset.term];
    tip.innerHTML = "";
    const b = document.createElement("b"), p = document.createElement("span");
    b.textContent = t.term;
    p.textContent = t.short;
    tip.append(b, p);
    if (el.tagName === "A") {
      const more = document.createElement("span");
      more.className = "more";
      more.textContent = "click for the glossary entry";
      tip.append(more);
    }
    if (!tip.isConnected) document.body.appendChild(tip);
    tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.max(8, Math.min(r.left, document.documentElement.clientWidth - w - 8));
    const top = r.bottom + h + 8 > window.innerHeight && r.top > h + 8 ? r.top - h - 6 : r.bottom + 6;
    tip.style.left = `${left + window.scrollX}px`;
    tip.style.top = `${top + window.scrollY}px`;
  };
  const hide = e => { if (e.target.closest && e.target.closest(".term")) tip.hidden = true; };
  document.addEventListener("mouseover", show);
  document.addEventListener("focusin", show);
  document.addEventListener("mouseout", hide);
  document.addEventListener("focusout", hide);
})();
</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
let pass = 0, step = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
const isNum = v => typeof v === "number";

function scaleOf(data) {
  let m = 0;
  for (const r of data) for (const v of r) if (isNum(v)) m = Math.max(m, Math.abs(v));
  const exp = (m > 0 && m < 0.1) ? Math.floor(Math.log10(m)) : 0;
  return { max: m / Math.pow(10, exp), exp };
}
function fmt(v, exp) {
  if (v === "-inf") return "−∞";
  if (v === "inf") return "+∞";
  if (!isNum(v)) return "";
  const x = v / Math.pow(10, exp);
  return (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2);
}

function header(v, extra) {
  const h = el("h3", null, v.label);
  if (extra) h.appendChild(el("small", null, extra));
  return h;
}

function matrix(v) {
  const box = el("div", "view");
  const { max, exp } = scaleOf(v.data);
  const n = v.data.length, m = v.data[0] ? v.data[0].length : 0;
  box.appendChild(header(v, `${n}×${m}` + (exp ? `  ·  values ×1e${exp}` : "")));
  const hl = new Set(v.hl || []);
  const t = el("table", hl.size ? "mat has-hl" : "mat"), hr = el("tr");
  hr.appendChild(el("th", "rl", ""));
  for (let j = 0; j < m; j++) hr.appendChild(el("th", null, v.cols ? v.cols[j] : j));
  t.appendChild(hr);
  v.data.forEach((row, i) => {
    const tr = el("tr", hl.has(i) ? "hl" : null);
    tr.appendChild(el("td", "rl", v.rows ? v.rows[i] : i));
    row.forEach(x => {
      const td = el("td", null, fmt(x, exp));
      if (isNum(x)) {
        const a = max > 0 ? Math.min(1, Math.abs(x / Math.pow(10, exp)) / max) : 0;
        td.style.background = `rgba(var(${x >= 0 ? "--pos" : "--neg"}), ${(a * 0.75).toFixed(3)})`;
        td.title = String(x);
      } else td.className = "masked";
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  const s = el("div", "scroll"); s.appendChild(t); box.appendChild(s);
  return box;
}

function heatmap(v) {
  const box = el("div", "view");
  const n = v.data.length, m = v.data[0].length, offset = m - n;
  box.appendChild(header(v, `${n}×${m} · each row sums to 1`));
  const t = el("table", "heat"), hr = el("tr");
  hr.appendChild(el("th", "rl", ""));
  v.cols.forEach(c => hr.appendChild(el("th", "rl", c)));
  t.appendChild(hr);
  v.data.forEach((row, i) => {
    const tr = el("tr");
    tr.appendChild(el("td", "rl", v.rows ? v.rows[i] : i));
    row.forEach((x, j) => {
      if (j > i + offset) { tr.appendChild(el("td", "masked", "·")); return; }
      const td = el("td", null, x.toFixed(2));
      td.style.background = `rgba(var(--heat), ${(0.08 + 0.92 * x).toFixed(3)})`;
      if (x > 0.55) td.style.color = "#fff";
      td.title = String(x);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  const s = el("div", "scroll"); s.appendChild(t); box.appendChild(s);
  return box;
}

function chips(v, small) {
  const box = el("div", "view");
  box.appendChild(header(v, `${v.data.length}`));
  const c = el("div", small ? "chips small" : "chips");
  v.data.forEach(([tok, id]) => {
    const ch = el("div", "chip");
    ch.appendChild(el("b", null, tok));
    if (id !== "" && id !== null) ch.appendChild(el("span", null, id));
    c.appendChild(ch);
  });
  box.appendChild(c);
  return box;
}

function topk(v) {
  const box = el("div", "view");
  box.appendChild(header(v));
  const [vh, ph] = v.cols || ["logit", "prob"];
  const hasP = v.data.length && v.data[0][2] !== null;
  const t = el("table", "plain"), hr = el("tr");
  ["token", vh].concat(hasP ? [ph, ""] : []).forEach(h => hr.appendChild(el("th", null, h)));
  t.appendChild(hr);
  v.data.forEach(([tok, val, p]) => {
    const tr = el("tr");
    tr.appendChild(el("td", "rl", tok));
    tr.appendChild(el("td", null, isNum(val) ? (val >= 0 ? "+" : "−") + Math.abs(val).toFixed(2) : ""));
    if (hasP) {
      tr.appendChild(el("td", null, (100 * p).toFixed(1) + "%"));
      const td = el("td"); td.style.width = "180px";
      const b = el("div", "bar"); b.style.width = (100 * p).toFixed(1) + "%";
      td.appendChild(b); tr.appendChild(td);
    }
    t.appendChild(tr);
  });
  box.appendChild(t);
  return box;
}

function table(v) {
  const box = el("div", "view");
  box.appendChild(header(v));
  const t = el("table", "plain");
  if (v.cols && v.cols.some(c => c)) {
    const hr = el("tr");
    v.cols.forEach(c => hr.appendChild(el("th", null, c)));
    t.appendChild(hr);
  }
  v.data.forEach(row => {
    const tr = el("tr");
    row.forEach((x, k) => tr.appendChild(el("td", k === 0 ? "rl" : null, x)));
    t.appendChild(tr);
  });
  const s = el("div", "scroll"); s.appendChild(t); box.appendChild(s);
  return box;
}

const RENDER = { matrix, vector: matrix, heatmap, tokens: v => chips(v, false),
                 vocab: v => chips(v, true), topk, table };

function renderPasses() {
  const box = document.getElementById("passes");
  box.innerHTML = "";
  if (DATA.passes.length < 2) return;
  DATA.passes.forEach((p, k) => {
    const b = el("button", k === pass ? "on" : null, p.label);
    b.onclick = () => { pass = k; step = Math.min(step, DATA.passes[k].steps.length - 1); render(); };
    box.appendChild(b);
  });
}

function renderNav() {
  const nav = document.getElementById("steps");
  nav.innerHTML = "";
  let sec = null;
  DATA.passes[pass].steps.forEach((s, k) => {
    if (s.section !== sec) { sec = s.section; nav.appendChild(el("div", "sec", sec)); }
    const a = el("a", k === step ? "on" : null, `${k + 1}. ${s.title}`);
    a.onclick = () => { step = k; render(); };
    nav.appendChild(a);
  });
  const on = nav.querySelector("a.on");
  if (on) on.scrollIntoView({ block: "nearest" });
}

function renderStep() {
  const steps = DATA.passes[pass].steps, s = steps[step];
  const main = document.getElementById("main");
  main.innerHTML = "";
  main.appendChild(el("div", "crumb", s.section));
  main.appendChild(el("h2", null, s.title));
  main.appendChild(el("div", "formula", s.formula));
  linkTerms(main.appendChild(el("p", "explain", s.explain)), { url: DATA.glossary, newTab: true });
  const views = el("div", "views");
  s.views.forEach(v => {
    const box = (RENDER[v.kind] || table)(v);
    if (v.role) {
      box.classList.add(v.role);
      const h = box.querySelector("h3");
      if (h) h.prepend(el("span", "role", v.role));
    }
    views.appendChild(box);
  });
  main.appendChild(views);
  main.appendChild(el("div", "hint", "Keys: ← → to move between steps. Hover a cell for its exact value."));
  document.getElementById("pos").textContent = `${step + 1} / ${steps.length}`;
}

// --- block diagram: highlight the block of the current step, click a block to go there ---
const NODE_RULES = [
  [/(^|\s)tok_emb\./, "n-tok-emb"], [/(^|\s)pos_emb\./, "n-pos-emb"], [/\.ln1\./, "n-ln1"],
  [/\.attn\.[qkv]\./, "n-qkv"], [/\.attn\.o\./, "n-concat"], [/\.ln2\./, "n-ln2"], [/\.ffn\./, "n-ffn"],
  [/(^|\s)ln_f\./, "n-lnf"], [/(^|\s)head\./, "n-head"],
  [/^Text → tokens|^Context so far|^Inputs and targets/, "n-tokenizer"],
  [/^Token embedding lookup|^Gradient through: Embeddings/, "n-tok-emb"],
  [/^Positional encoding/, "n-pos-emb"], [/^Input to the first block/, "n-add0"],
  [/^LayerNorm 1/, "n-ln1"], [/^Projection weights|^Queries, keys, values|^RoPE/, "n-qkv"], [/^KV-cache/, "n-kv"],
  [/^Concatenate heads/, "n-concat"], [/^Residual connection 1/, "n-add1"], [/^LayerNorm 2/, "n-ln2"],
  [/^Feed-forward/, "n-ffn"], [/^Residual connection 2/, "n-add2"],
  [/^Final LayerNorm|^Gradient through: Final LayerNorm/, "n-lnf"],
  [/^Logits|^Last position|^Gradient of the loss w\.r\.t\. the logits|^Gradient through: Unembedding/, "n-head"],
  [/^Softmax|^Loss: cross-entropy/, "n-softmax"], [/^Pick the next token/, "n-sample"],
  [/^Gradient through: Layer/, "n-block"],
];
// training pages show the training diagram: forward, loss, backward (b-*), optimiser
const TRAIN_RULES = [
  [/^Inputs and targets/, ["t-batch"]], [/^Loss: cross-entropy/, ["t-loss"]],
  [/^Gradient of the loss w\.r\.t\. the logits/, ["t-loss", "b-logits"]],
  [/^Gradient through: Unembedding/, ["t-head", "b-logits"]],
  [/^Gradient through: Final LayerNorm/, ["t-lnf", "b-head"]],
  [/^Gradient through: Layer/, ["t-block", "b-lnf"]],
  [/^Gradient through: Embeddings/, ["t-emb", "b-block"]],
  [/^Gradient of every parameter/, ["t-grads"]], [/^Gradient clipping/, ["t-clip"]],
  [/^AdamW update/, ["t-adam", "t-update"]], [/^Same batch, after the update/, ["t-loss", "t-update"]],
];
function nodesFor(s) {
  if (DATA.diagram === "training") {
    for (const [re, ids] of TRAIN_RULES) if (re.test(s.title)) return ids;
    return [];
  }
  // the steps of one head light up its lane: head 1 on the left, any other head on the right
  const head = s.section.match(/Head (\d+)\//);
  if (head) return [+head[1] === 1 ? "n-head1" : "n-head2"];
  if (/^All \d+ heads/.test(s.title)) return ["n-attn", "n-head1", "n-head2"];
  for (const [re, id] of NODE_RULES) if (re.test(s.title)) return [id];
  return [];
}
function nodeFor(s) { return nodesFor(s)[0] || null; }
function layerOf(s) {
  const m = (s.section + " " + s.title).match(/Layer (\d+)(?:\/(\d+))?/);
  return m ? { i: +m[1], n: m[2] ? +m[2] : null } : null;
}
const diagram = document.querySelector("#diagram svg");
function fillDiagramLabels() {
  const c = DATA.model;
  if (!diagram || !c) return;
  const v = { V: c.vocab_size, C: c.d_model, T: c.block_size, H: c.n_heads, D: c.d_model / c.n_heads,
              L: c.n_layers, F: c.d_ff };
  diagram.querySelectorAll("[data-fmt]").forEach(t => {
    t.textContent = t.dataset.fmt.replace(/\{(\w)\}/g, (_, k) => v[k] ?? k);
  });
  const dots = diagram.querySelector("#llmsim-head-dots");
  if (dots) dots.style.display = c.n_heads > 2 ? "" : "none";
  ropeLabels(diagram, c);
  if (c.n_heads < 2) diagram.querySelectorAll("#n-head2, #llmsim-head-dots").forEach(e => e.style.display = "none");
}
// with RoPE nothing is added to the token embeddings: the positions rotate Q and K
function ropeLabels(svg, c) {
  if (c.pos_encoding !== "rope") return;
  const pos = svg.querySelector("#n-pos-emb .sub"), qkv = svg.querySelector("#n-qkv .sub");
  if (pos) pos.textContent = "none (RoPE)";
  if (qkv) qkv.textContent = "x·W_Q, x·W_K, x·W_V + RoPE";
}
function renderDiagram() {
  if (!diagram) return;
  const steps = DATA.passes[pass].steps, s = steps[step], ids = nodesFor(s);
  diagram.querySelectorAll(".node, .back").forEach(n => {
    n.classList.toggle("on", ids.includes(n.id));
    n.classList.toggle("clickable", steps.some(x => nodeFor(x) === n.id));
  });
  const L = layerOf(s), head = s.section.match(/Head (\d+)\/(\d+)/), all = s.title.match(/^All (\d+) heads/);
  const lb = diagram.querySelector("#llmsim-layer-badge"), hb = diagram.querySelector("#llmsim-head-badge");
  if (lb) lb.textContent = L ? `layer ${L.i}${L.n ? " / " + L.n : ""}` : "";
  if (hb) hb.textContent = head ? `head ${head[1]} / ${head[2]}` : all ? `all ${all[1]} heads` : "";
  const lane2 = diagram.querySelector("#llmsim-lane2");     // shows the head being traced
  if (lane2 && DATA.model) lane2.textContent = `head ${head && +head[1] > 1 ? head[1] : DATA.model.n_heads}`;
}
if (diagram) {
  diagram.querySelectorAll(".node").forEach(n => n.addEventListener("click", () => {
    const steps = DATA.passes[pass].steps, cur = layerOf(steps[step]);
    const hits = steps.map((x, k) => [x, k]).filter(([x]) => nodeFor(x) === n.id);
    if (!hits.length) return;
    const sameLayer = cur && hits.find(([x]) => { const l = layerOf(x); return l && l.i === cur.i; });
    step = (sameLayer || hits[0])[1];
    document.body.classList.remove("diagram-open");
    render();
  }));
  fillDiagramLabels();
}
document.getElementById("diagram-toggle").onclick = () => document.body.classList.toggle("diagram-open");
document.getElementById("diagram-close").onclick = () => document.body.classList.remove("diagram-open");

function render() { renderPasses(); renderNav(); renderStep(); renderDiagram(); }
function move(d) {
  const n = DATA.passes[pass].steps.length;
  step = Math.max(0, Math.min(n - 1, step + d));
  render();
  window.scrollTo({ top: 0 });
}
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
document.getElementById("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") move(1);
  if (e.key === "ArrowLeft") move(-1);
});
document.getElementById("title").textContent = DATA.title;
if (DATA.home) { const a = document.getElementById("home"); a.href = DATA.home; a.hidden = false; }
if (DATA.glossary) { const a = document.getElementById("glossary-link"); a.href = DATA.glossary; a.hidden = false; }
render();
</script>
